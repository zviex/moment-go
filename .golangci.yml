version: "2"
linters:
  default: all
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - errcheck
    - gochecknoinits
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - bodyclose
    - containedctx
    - depguard
    - dupl
    - err113
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - godot
    - godox
    - gosec
    - inamedparam
    - ireturn
    - lll
    - mnd
    - musttag
    - nakedret
    - nestif
    - nilnil
    - nonamedreturns
    - noinlineerr
    - nlreturn
    - paralleltest
    - protogetter
    - revive
    - tagliatelle
    - testpackage
    - wrapcheck
    - wsl
    - whitespace
    - varnamelen
  exclusions:
    generated: lax
#    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - mnd
          - errcheck
          - unparam
          - forbidigo
          - thelper
          - thelper
          - prealloc
          - gosmopolitan
          - gocognit
          - errchkjson
          - cyclop
          - noctx
          - goconst
          - gocritic
          - maintidx
      - path: pkg/glob/cmd/glob-cli
        linters:
          - thelper
          - forbidigo
  settings:
    cyclop:
      max-complexity: 13

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - golines
  exclusions:
    warn-unused: true
    generated: lax
  settings:
    golines:
      max-len: 200